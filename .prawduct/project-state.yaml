#     `risk_surfaces:` below has held the five paths since, and the comment there
#     already recorded that it closed this question.
# =============================================================================
# DATA LOCALITY — THE BOUNDARY, RULED 2026-09-07
# =============================================================================
# `[DECISION: a PRIVATE git remote is an acceptable reading of "financial data
# must not leave the machine except as an encrypted backup" | taken by the owner
# 2026-09-07, answering deployment open question 6.4 with its option (b) | user
# can revisit]`
#
# The remote is `git@github.com:brookstalley/bankmachine.git`, verified PRIVATE
# on the day of the ruling. The constraint's boundary is therefore the private
# remote, not this machine, and that is now written down rather than contradicted
# in silence -- which was the whole point of 6.4 recording it as open.
#
# What this ruling does NOT do, stated because the alternative reading is
# available and wrong:
#
#   - It does not undo the gitignore. `deployment/` stays ignored and the leak
#     guard stays enforcing. 6.4's option (a) was already executed on 2026-09-05
#     -- verified 2026-09-07: `docs/data-sources.md` appears in no commit on any
#     ref, no roster blob exists anywhere in history, and `deployment/` was never
#     tracked. Undoing that would cost something and buy nothing.
#   - It does not amend the ratified norms. "No roster or operator identity in
#     anything pushed" (project-preferences) and "configuration is gitignored"
#     still bind. This ruling widens where *the product's own data* may rest; it
#     does not license roster rows into git.
#
# 🔴 The one consequence that bites later: **publishing this repository moves the
# boundary again, and this ruling does not cover it.** GitHub keeps unreachable
# objects fetchable by SHA after a history purge, so flipping this repo public is
# not equivalent to publishing a clean one. If the tool is published, publish a
# NEW repository -- and revisit this ruling before doing either.

